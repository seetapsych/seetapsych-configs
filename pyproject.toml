[project]
name = "seetapsych-configs"
description = "SeetaPsych Configs"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
license = { file = "LICENSE" }
dependencies = [
    "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://github.com/seetapsych/seetapsych-configs"
Repository = "https://github.com/seetapsych/seetapsych-configs"
Issues = "https://github.com/seetapsych/seetapsych-configs/issues"

[project.optional-dependencies]
dev = [
    # build tools
    "build>=1.4.4",
    "twine>=6.2.0",
    # test tools
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "types-PyYAML>=6.0",
]

[dependency-groups]
dev = [
    "seetapsych-configs[dev]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".venv",
    "dist",
    "build",
    "*.egg-info",
    "seetapsych_configs/_version.py",
]

[tool.ruff.lint]
select = [
    "E",  # PEP 8 syntax / style errors (pycodestyle)
    "F",  # Undefined names, unused imports, logical errors (Pyflakes)
    "B",  # Common logic pitfalls (flake8-bugbear: mutable defaults, bare except, etc.)
    "I",  # Import ordering and grouping (isort)
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
plugins = []
exclude = [
    "seetapsych_configs/_version.py",
    "tests/",
]

[tool.bandit]
exclude_dirs = [
    "tests",
    ".venv",
    "dist",
    "build",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0.dev0"
tag-pattern = "^r(?P<version>[^-]+)$"

[tool.hatch.build.hooks.vcs]
version-file = "seetapsych_configs/_version.py"

[build-system]
requires = ["hatchling>=1.26", "hatch-vcs>=0.4.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seetapsych_configs"]

[tool.hatch.build.targets.wheel.package-data]
seetapsych_configs = ["configs.yml"]
